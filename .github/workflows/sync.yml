name: Upstream Sync

permissions:
  contents: write

# Upstream has conflicts with local customizations. Run manually only;
# resolve updates on a separate branch and review before merging.
on:
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Check upstream merge on an isolated branch
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check upstream merge without pushing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Upstream merge check'
          git config user.email 'action@github.com'
          git remote add upstream https://github.com/ChatGPTNextWeb/ChatGPT-Next-Web.git
          git fetch upstream main
          git switch -c upstream-merge-check
          if ! git merge --no-commit --no-ff upstream/main; then
            git diff --name-only --diff-filter=U
            git merge --abort || true
            echo '::error::Upstream merge failed. See merge output above; resolve on a separate branch and open a PR. No changes were pushed.'
            exit 1
          fi
          git merge --abort || true
          echo 'Merge check passed. No changes were pushed or deployed.'
